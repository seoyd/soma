[package]
name = "soma-zero"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"  # 2024 에디션 최소 버전 (MSRV)
license = "MIT OR Apache-2.0"
authors = ["Soma Project Contributors"]
publish = false
autotests = false

[workspace]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"

[[bin]]
name = "soma-zero"
path = "src/main.rs"

[[test]]
name = "minimal_ai_committee_core"
path = "tests/minimal_ai_committee_core.rs"

[[test]]
name = "workspace_timeout_reduction_queue"
path = "tests/workspace_timeout_reduction_queue.rs"

[profile.dev]
incremental = true
lto = false
codegen-units = 256

[profile.test]
incremental = true
lto = false
codegen-units = 256
debug = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
