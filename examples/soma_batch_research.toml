matrix_id = "batch_research"
continue_on_failure = true
require_all_pass = false
deterministic_run_id = "batch-research-seed"
reason_codes = ["DeterministicPath"]

[dataset_bundle]
bundle_id = "research_fixture_bundle"
output_root = "target/soma_batch_experiments"
reason_codes = ["DeterministicPath"]

[dataset_bundle.default_data_validation_config]
strict = true
allow_sort_repair = false
allow_duplicate_drop = false
allow_gap = true
max_gap_count = 1000000
max_gap_ratio = 1.0
max_invalid_ratio = 1.0
expected_step_ms = 60000
reason_codes = ["DeterministicPath"]

[dataset_bundle.default_feature_config]
return_windows = [1, 3, 5, 10, 20]
volatility_windows = [10, 20]
volume_windows = [5, 20]
atr_window = 14
vwap_window = 20
zscore_window = 20
min_required_bars = 5
include_spread_features = true
include_time_features = true

[dataset_bundle.default_walk_forward_config]
train_window_bars = 5
validation_window_bars = 2
test_window_bars = 3
step_bars = 2
embargo_bars = 0
min_train_bars = 5
max_folds = 2
allow_partial_last_fold = false

[dataset_bundle.default_triple_barrier_config]
take_profit_pct = 0.02
stop_loss_pct = 0.01
horizon_bars = 2
fee_bps = 2.0
slippage_bps = 2.0
side = "Long"
use_high_low_intrabar = true

[dataset_bundle.default_cost_model]
fee_bps = 2.0
slippage_bps = 2.0
spread_bps = 2.0

[dataset_bundle.default_risk_config]
max_daily_loss_pct = 0.03
max_consecutive_losses = 3
min_expected_edge = 0.001
min_confidence = 0.55
max_spread_bps = 12.0
min_data_quality = 0.80
min_api_health = 0.80
max_allowed_volatility = 0.04
min_risk_reward = 1.5
max_total_exposure = 1.0
max_symbol_exposure = 0.35
min_trade_value = 250000.0

[[dataset_bundle.entries]]
dataset_id = "valid_fixture"
symbol = "BTC-USDT"
data_path = "tests/fixtures/market_data/generic_ohlcv_valid.csv"
csv_format = "GenericOhlcv"
timeframe = "OneMinute"
resample_to = "FiveMinute"
venue = "Generic"
asset_class = "Crypto"
enabled = true
tags = ["fixture", "valid"]
expected_min_rows = 5
notes = "valid synthetic fixture"
reason_codes = ["DeterministicPath"]

[[variants]]
variant_id = "baseline_5m"
mode = "BaselineOnly"
enabled = true
tags = ["baseline"]
reason_codes = ["DeterministicPath"]

[variants.overrides]
timeframe = "OneMinute"
resample_to = "FiveMinute"
