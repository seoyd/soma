export_id = "sprint62-sequence-export-small"
sequence_readiness_hardening_paths = ["examples/sprint62_data/kis_complete_rows_sample.json"]
kis_evidence_closure_paths = ["examples/sprint61_data/kis_evidence_after.json"]
outcome_link_depth_closure_paths = ["examples/sprint61_data/outcome_link_depth_sample.json"]
kis_canonical_csv_paths = ["examples/sprint62_data/kis_sequence_source_rows.json"]
feature_schema_lock_paths = ["examples/sprint62_data/feature_schema_frozen.json"]
label_alignment_audit_paths = ["examples/sprint62_data/label_manifest_frozen.json"]
no_lookahead_proof_paths = ["examples/sprint62_data/no_lookahead_windows_sample.json"]
